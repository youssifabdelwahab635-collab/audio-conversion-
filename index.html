<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوديو الصوت الكوني</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow-x: hidden;
        }
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            background: rgba(12, 18, 34, 0.78);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 26px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(59, 130, 246, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        h1 {
            font-size: 1.35rem;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #ambient-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #e2e8f0;
            padding: 8px 13px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #ambient-btn.playing {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
            color: #86efac;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.35);
        }
        .input-wrapper {
            position: relative;
        }
        textarea {
            width: 100%;
            height: 135px;
            background: rgba(2, 6, 23, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            padding: 15px;
            padding-bottom: 34px;
            color: #ffffff;
            font-size: 1.05rem;
            resize: none;
            outline: none;
            line-height: 1.55;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .clear-btn {
            position: absolute;
            bottom: 10px;
            left: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .clear-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
        }
        .section-label {
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .voices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .voice-card {
            padding: 12px 10px;
            border-radius: 15px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .voice-card:active {
            transform: scale(0.97);
        }
        .voice-card.active {
            border-color: #38bdf8;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(37, 99, 235, 0.22));
            color: #ffffff;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.28);
        }
        .sliders-panel {
            background: rgba(2, 6, 23, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 13px 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .slider-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slider-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .slider-top span:last-child {
            color: #60a5fa;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .main-actions {
            display: flex;
            gap: 10px;
            margin-top: 2px;
        }
        #speak-btn {
            flex: 2.3;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #0284c7);
            color: #ffffff;
            font-size: 1.08rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 207, 0.4);
            transition: transform 0.12s, filter 0.2s;
        }
        #speak-btn:active {
            transform: scale(0.97);
        }
        #stop-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 16px;
            background: rgba(220, 38, 38, 0.88);
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.12s;
        }
        #stop-btn:active {
            transform: scale(0.97);
        }
        .status-hint {
            text-align: center;
            font-size: 0.78rem;
            color: #64748b;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <canvas id="galaxy-canvas"></canvas>

    <div class="app-container">
        <div class="top-bar">
            <h1>✨ ناطق النصوص</h1>
            <button id="ambient-btn" onclick="toggleAmbientSound()">🎵 صوت الخلفية: مغلق</button>
        </div>

        <div class="input-wrapper">
            <textarea id="text-area" placeholder="اكتب أي كلام هنا عشان يتحول لصوت..."></textarea>
            <button class="clear-btn" onclick="clearText()">مسح</button>
        </div>

        <div>
            <div class="section-label">اختر شخصية الصوت:</div>
            <div class="voices-grid">
                <button class="voice-card active" id="v-male" onclick="choosePreset('male')">👨 صوت راجل</button>
                <button class="voice-card" id="v-female" onclick="choosePreset('female')">👩 صوت ست</button>
                <button class="voice-card" id="v-child" onclick="choosePreset('child')">🧒 صوت طفل</button>
                <button class="voice-card" id="v-robot" onclick="choosePreset('robot')">🤖 صوت آلي</button>
            </div>
        </div>

        <div class="sliders-panel">
            <div class="slider-item">
                <div class="slider-top">
                    <span>نبرة الصوت (Pitch)</span>
                    <span id="pitch-label">0.80</span>
                </div>
                <input type="range" id="pitch-range" min="0.4" max="1.9" step="0.05" value="0.80" oninput="syncLabels()">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span>سرعة النطق (Rate)</span>
                    <span id="rate-label">1.00</span>
                </div>
                <input type="range" id="rate-range" min="0.5" max="1.6" step="0.05" value="1.00" oninput="syncLabels()">
            </div>
        </div>

        <div class="main-actions">
            <button id="speak-btn" onclick="speakText()">🔊 حوّل لكلام</button>
            <button id="stop-btn" onclick="stopSpeaking()">⏹ إيقاف</button>
        </div>

        <div class="status-hint" id="status-hint">جاهز لتحويل النص إلى صوت</div>
    </div>

    <script>
        // 1. خلفية المجرة والنجوم المتحركة والمضيئة
        const canvas = document.getElementById('galaxy-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        let shootingStars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const starColors = ['255, 255, 255', '186, 230, 253', '196, 181, 253', '253, 224, 71'];

        for (let i = 0; i < 180; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 0.25 + 0.05;
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.4,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: Math.random(),
                twinkleSpeed: Math.random() * 0.025 + 0.006,
                color: starColors[Math.floor(Math.random() * starColors.length)]
            });
        }

        function spawnShootingStar() {
            if (shootingStars.length < 2 && Math.random() < 0.008) {
                shootingStars.push({
                    x: Math.random() * canvas.width * 0.8,
                    y: Math.random() * canvas.height * 0.4,
                    len: Math.random() * 70 + 40,
                    speedX: Math.random() * 5 + 4,
                    speedY: Math.random() * 3 + 2,
                    life: 1
                });
            }
        }

        function drawGalaxy() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // توهج خفيف جداً في منتصف الخلفية يشبه المجرة
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const grad = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, Math.max(canvas.width, canvas.height) * 0.6);
            grad.addColorStop(0, 'rgba(30, 58, 138, 0.14)');
            grad.addColorStop(0.5, 'rgba(88, 28, 135, 0.06)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                s.x += s.vx;
                s.y += s.vy;

                if (s.x < -10) s.x = canvas.width + 10;
                if (s.x > canvas.width + 10) s.x = -10;
                if (s.y < -10) s.y = canvas.height + 10;
                if (s.y > canvas.height + 10) s.y = -10;

                s.alpha += s.twinkleSpeed;
                if (s.alpha <= 0.15 || s.alpha >= 1) {
                    s.twinkleSpeed *= -1;
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${s.color}, ${s.alpha})`;
                ctx.shadowBlur = s.radius > 1.5 ? 10 : 4;
                ctx.shadowColor = `rgba(${s.color}, 0.9)`;
                ctx.fill();
            });

            spawnShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const st = shootingStars[i];
                ctx.save();
                ctx.strokeStyle = `rgba(255, 255, 255, ${st.life})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(st.x, st.y);
                ctx.lineTo(st.x - st.speedX * 4, st.y - st.speedY * 4);
                ctx.stroke();
                ctx.restore();

                st.x += st.speedX;
                st.y += st.speedY;
                st.life -= 0.02;
                if (st.life <= 0) shootingStars.splice(i, 1);
            }

            requestAnimationFrame(drawGalaxy);
        }
        drawGalaxy();

        // 2. صوت خلفية خفيف ومريح (Ambient Space Drone) بدون ملفات خارجية
        let audioCtx = null;
        let ambientGain = null;
        let isAmbientOn = false;

        function toggleAmbientSound() {
            const btn = document.getElementById('ambient-btn');
            if (!isAmbientOn) {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();

                    ambientGain = audioCtx.createGain();
                    ambientGain.gain.value = 0.035; // صوت خفيف جداً ومريح للأذن

                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 260;

                    const osc1 = audioCtx.createOscillator();
                    osc1.type = 'sine';
                    osc1.frequency.value = 110; // نغمة هادئة

                    const osc2 = audioCtx.createOscillator();
                    osc2.type = 'triangle';
                    osc2.frequency.value = 164.81; // توافق هادئ

                    osc1.connect(filter);
                    osc2.connect(filter);
                    filter.connect(ambientGain);
                    ambientGain.connect(audioCtx.destination);

                    osc1.start();
                    osc2.start();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                ambientGain.gain.setTargetAtTime(0.035, audioCtx.currentTime, 0.3);
                isAmbientOn = true;
                btn.classList.add('playing');
                btn.innerText = '🎵 صوت الخلفية: شغال';
            } else {
                if (ambientGain && audioCtx) {
                    ambientGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.2);
                }
                isAmbientOn = false;
                btn.classList.remove('playing');
                btn.innerText = '🎵 صوت الخلفية: مغلق';
            }
        }

        // 3. إعدادات الأصوات (راجل - ست - طفل - آلي)
        let currentPreset = 'male';
        let availableVoices = [];

        function loadSystemVoices() {
            availableVoices = window.speechSynthesis.getVoices();
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadSystemVoices;
            loadSystemVoices();
        }

        const presets = {
            male:   { pitch: 0.80, rate: 0.98, label: 'صوت راجل' },
            female: { pitch: 1.25, rate: 1.02, label: 'صوت ست' },
            child:  { pitch: 1.65, rate: 1.12, label: 'صوت طفل' },
            robot:  { pitch: 0.55, rate: 0.85, label: 'صوت آلي' }
        };

        function choosePreset(presetName) {
            currentPreset = presetName;
            document.querySelectorAll('.voice-card').forEach(card => card.classList.remove('active'));
            document.getElementById('v-' + presetName).classList.add('active');

            const p = presets[presetName];
            document.getElementById('pitch-range').value = p.pitch;
            document.getElementById('rate-range').value = p.rate;
            syncLabels();
            document.getElementById('status-hint').innerText = `تم اختيار: ${p.label}`;
        }

        function syncLabels() {
            document.getElementById('pitch-label').innerText = parseFloat(document.getElementById('pitch-range').value).toFixed(2);
            document.getElementById('rate-label').innerText = parseFloat(document.getElementById('rate-range').value).toFixed(2);
        }

        function clearText() {
            document.getElementById('text-area').value = '';
            document.getElementById('text-area').focus();
        }

        function speakText() {
            const text = document.getElementById('text-area').value.trim();
            const status = document.getElementById('status-hint');

            if (!text) {
                status.innerText = 'اكتب كلام الأول عشان يتنطق';
                return;
            }

            if (!('speechSynthesis' in window)) {
                status.innerText = 'الجهاز أو المتصفح لا يدعم تحويل النص لصوت';
                return;
            }

            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ar-EG';
            utter.pitch = parseFloat(document.getElementById('pitch-range').value);
            utter.rate = parseFloat(document.getElementById('rate-range').value);

            const arVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
            if (arVoices.length > 0) {
                if (currentPreset === 'female') {
                    const fVoice = arVoices.find(v => /female|laila|salma|hoda|zira/i.test(v.name));
                    utter.voice = fVoice || arVoices[arVoices.length - 1];
                } else {
                    const mVoice = arVoices.find(v => /male|majed|naayf|tarik/i.test(v.name));
                    utter.voice = mVoice || arVoices[0];
                }
            }

            utter.onstart = () => {
                status.innerText = `جاري النطق (${presets[currentPreset].label})...`;
            };
            utter.onend = () => {
                status.innerText = 'تم الانتهاء من النطق';
            };
            utter.onerror = () => {
                status.innerText = 'تأكد من تفعيل صوت عربي في إعدادات Text-to-Speech بالموبايل';
            };

            window.speechSynthesis.speak(utter);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            document.getElementById('status-hint').innerText = 'تم إيقاف الصوت';
        }
    </script>
</body>
</html>
